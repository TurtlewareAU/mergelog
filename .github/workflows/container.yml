name: Publish and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mergelog-production-pipeline
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE }}/mergelog

jobs:
  publish:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, swarm]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_NAMESPACE" || { echo "Missing repository variable: DOCKERHUB_NAMESPACE"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing repository secret: DOCKERHUB_TOKEN"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, swarm]
    environment:
      name: production
      url: https://${{ vars.MERGELOG_HOSTNAME }}
    permissions:
      contents: read
    env:
      MERGELOG_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/mergelog@${{ needs.publish.outputs.digest }}
      MERGELOG_HOSTNAME: ${{ vars.MERGELOG_HOSTNAME }}
      MERGELOG_DATA_PATH: ${{ vars.MERGELOG_DATA_PATH }}
      MERGELOG_TOKEN_SECRET: ${{ vars.MERGELOG_TOKEN_SECRET }}
      TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
      TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT }}
      TRAEFIK_CERT_RESOLVER: ${{ vars.TRAEFIK_CERT_RESOLVER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy and verify
        run: ./deploy/deploy.sh
