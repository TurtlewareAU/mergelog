name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test application
    runs-on: [self-hosted, Linux, X64, pve]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Build server
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web application
        run: npm --prefix web run build

  container:
    name: Build and check container
    needs: verify
    runs-on: [self-hosted, Linux, X64, pve]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mergelog:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the running container
        env:
          IMAGE: mergelog:pr-${{ github.event.pull_request.number || github.run_id }}
        run: ./scripts/container-check.sh
