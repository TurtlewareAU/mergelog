name: PVE runner preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: PVE preflight ${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64, pve]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check runner prerequisites
        run: ./scripts/pve-preflight.sh
