name: Mirror to personal repository

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: personal-repository-mirror
  cancel-in-progress: true

jobs:
  mirror:
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, X64, pve]

    steps:
      - name: Configure mirror SSH key
        env:
          MIRROR_SSH_PRIVATE_KEY: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$MIRROR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Mirror branches and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
        run: |
          git clone --bare \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "$mirror_path"
