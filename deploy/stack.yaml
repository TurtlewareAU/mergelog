version: "3.9"

services:
  journal:
    image: ${MERGELOG_IMAGE:?Set MERGELOG_IMAGE to a versioned image or digest}
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: "/data/journal.sqlite"
      MCP_TOKENS_FILE: "/run/secrets/mcp_tokens"
      ALLOWED_HOSTS: "${MERGELOG_HOSTNAME:?Set MERGELOG_HOSTNAME},journal,localhost,127.0.0.1"
    secrets:
      - source: mcp_tokens
        target: mcp_tokens
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - type: bind
        source: ${MERGELOG_DATA_PATH:-/mnt/docker/mergelog}
        target: /data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.mergelog.storage == true
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
        - traefik.http.routers.mergelog.rule=Host(`${MERGELOG_HOSTNAME:?Set MERGELOG_HOSTNAME}`)
        - traefik.http.routers.mergelog.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.mergelog.tls=true
        - traefik.http.routers.mergelog.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.services.mergelog.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

secrets:
  mcp_tokens:
    external: true
    name: ${MERGELOG_TOKEN_SECRET:-mergelog_mcp_tokens_v1}
